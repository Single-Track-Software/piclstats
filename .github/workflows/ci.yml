name: CI

on:
  pull_request:
  # Called by fly-deploy.yml on pushes to main so a red build blocks the
  # production deploy. Not triggered on push directly, or main would run the
  # same checks twice.
  workflow_call:

jobs:
  check:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install
        run: |
          uv venv --python 3.11
          uv pip install -e ".[dev]"

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      # Tests stub the DB layer, so no PostgreSQL service is needed.
      - name: Pytest
        run: uv run pytest tests/ -q
