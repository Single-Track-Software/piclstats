# fly.toml app configuration file generated for piclstats on 2026-04-14T21:12:25-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'piclstats'
primary_region = 'ord'

[build]

[deploy]
  # Runs in a temporary machine after build, before the new version serves
  # traffic. Reads the DB URL via config.py's DATABASE_URL fallback (start.sh
  # does not run here).
  release_command = 'alembic upgrade head'

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine warm so coaches never hit a cold start. Set back to 0 to
  # scale to zero when idle (the machine then auto-starts on the next request,
  # a few seconds later).
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
