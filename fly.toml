# fly.toml app configuration file generated for piclstats on 2026-04-14T21:12:25-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'piclstats'
primary_region = 'ord'

[build]

[deploy]
  # Runs in a temporary machine after build, before the new version serves
  # traffic. Reads the DB URL via config.py's DATABASE_URL fallback (start.sh
  # does not run here).
  release_command = 'alembic upgrade head'

[http_service]
  internal_port = 8080
  force_https = true
  # Keep two machines warm (run `fly scale count 2` once; Fly spreads them
  # across hosts). With one, a machine wedged on a bad host takes the site
  # down (2026-10-02); with two, the health check below routes around it.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 2
  processes = ['app']

  # /healthz answers 200 only when the machine can reach the database. Fly
  # stops sending traffic to a machine that fails it.
  [[http_service.checks]]
    grace_period = '20s'
    interval = '15s'
    method = 'GET'
    path = '/healthz'
    timeout = '5s'

# Shared CPU, 1 GB. Dedicated CPU (2026-10-22) was a response to a bot flood that
# spent the shared burst allowance and left the machines throttled; at $33/machine/mo
# it cost more than the site. Bots are now stopped at Cloudflare (Bot Fight Mode +
# a per-IP rate-limiting rule on piclstats.com) before they reach Fly. 1 GB leaves
# ~3x headroom over the ~300 MB the app uses.
[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
