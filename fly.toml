# fly.toml app configuration file generated for piclstats on 2026-04-14T21:12:25-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'piclstats'
primary_region = 'ord'

[build]

[deploy]
  # Runs in a temporary machine after build, before the new version serves
  # traffic. Reads the DB URL via config.py's DATABASE_URL fallback (start.sh
  # does not run here).
  release_command = 'alembic upgrade head'

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero when idle: the machine stops with no traffic and auto-starts
  # on the next request (a few seconds of cold start). Set min_machines_running
  # = 1 temporarily if you need it warm for a live demo.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
