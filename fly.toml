# fly.toml app configuration file generated for piclstats on 2026-04-14T21:12:25-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'piclstats'
primary_region = 'ord'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine warm during the demo week to avoid cold-start latency.
  # Revert to 'stop' / 0 after the demo to return to scale-to-zero.
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
